name: SHACL validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shacl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-kg:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyshacl==0.40.1' 'rdflib==7.6.0'

      - name: Generate license-safe SHACL fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/makaao-shacl-ci-fixture.ttl"
          python tests/build_shacl_fixture.py --output "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Parse SHACL shapes and synthetic fixture
        env:
          DATA_GRAPH: ${{ steps.fixture.outputs.path }}
        run: |
          python - <<'PY'
          import os
          from rdflib import Graph

          shapes = Graph().parse("tests/shacl_shapes.ttl", format="turtle")
          data = Graph().parse(os.environ["DATA_GRAPH"], format="turtle")
          if not data:
              raise SystemExit("Synthetic SHACL fixture is empty")
          print(f"Parsed {len(shapes)} SHACL triples and {len(data)} fixture triples")
          PY

      - name: Validate synthetic fixture
        shell: bash
        env:
          DATA_GRAPH: ${{ steps.fixture.outputs.path }}
        run: |
          set +e
          pyshacl \
            --shacl tests/shacl_shapes.ttl \
            --shacl-file-format turtle \
            --data-file-format turtle \
            --inference rdfs \
            --advanced \
            --format human \
            --allow-warnings \
            --output shacl_fixture_report.txt \
            "$DATA_GRAPH"
          status=$?
          set -e
          cat shacl_fixture_report.txt
          exit "$status"

      - name: Select optional checked-in KG
        id: repository_graph
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          script = Path("scripts/03_build_kg_from_tables.py")
          tree = ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          values = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id in {"SCRIPT_VERSION", "KG_VERSION"}:
                      values[target.id] = ast.literal_eval(node.value)

          missing = {"SCRIPT_VERSION", "KG_VERSION"} - values.keys()
          if missing:
              raise SystemExit(f"Missing version assignment(s) in {script}: {sorted(missing)}")

          canonical = Path("kg") / f"makaao_kg_{values['KG_VERSION']}.rdf"
          sample = Path("kg/makaao_kg_sample.rdf")
          selected = canonical if canonical.is_file() else sample if sample.is_file() else None

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"path={selected or ''}\n")
              handle.write(f"script_version={values['SCRIPT_VERSION']}\n")
              handle.write(f"is_canonical={'true' if selected == canonical else 'false'}\n")

          if selected is None:
              print("No checked-in KG fixture found; synthetic SHACL validation is sufficient.")
          else:
              print(f"Optional repository graph selected: {selected}")
          PY

      - name: Parse and version-check optional KG
        if: steps.repository_graph.outputs.path != ''
        env:
          DATA_GRAPH: ${{ steps.repository_graph.outputs.path }}
          EXPECTED_SCRIPT_VERSION: ${{ steps.repository_graph.outputs.script_version }}
          IS_CANONICAL: ${{ steps.repository_graph.outputs.is_canonical }}
        run: |
          python - <<'PY'
          import os
          from rdflib import Graph, Namespace

          graph_path = os.environ["DATA_GRAPH"]
          expected_version = os.environ["EXPECTED_SCRIPT_VERSION"]
          is_canonical = os.environ["IS_CANONICAL"] == "true"

          data = Graph().parse(graph_path, format="xml")
          dcterms = Namespace("http://purl.org/dc/terms/")
          versions = {str(value) for value in data.objects(None, dcterms.hasVersion)}

          if is_canonical and expected_version not in versions:
              raise SystemExit(
                  f"Canonical graph {graph_path} is stale: expected {expected_version!r}; "
                  f"recorded versions are {sorted(versions)!r}"
              )
          if not is_canonical and versions and expected_version not in versions:
              raise SystemExit(
                  f"Sample graph {graph_path} is stale: expected {expected_version!r}; "
                  f"recorded versions are {sorted(versions)!r}"
              )
          print(f"Optional graph parsed successfully ({len(data)} triples)")
          PY

      - name: Validate optional checked-in KG
        if: steps.repository_graph.outputs.path != ''
        shell: bash
        env:
          DATA_GRAPH: ${{ steps.repository_graph.outputs.path }}
        run: |
          set +e
          pyshacl \
            --shacl tests/shacl_shapes.ttl \
            --shacl-file-format turtle \
            --data-file-format xml \
            --inference rdfs \
            --advanced \
            --format human \
            --allow-warnings \
            --output shacl_repository_report.txt \
            "$DATA_GRAPH"
          status=$?
          set -e
          cat shacl_repository_report.txt
          exit "$status"

      - name: Upload SHACL reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shacl-validation-reports
          path: |
            shacl_fixture_report.txt
            shacl_repository_report.txt
          if-no-files-found: warn