name: SHACL validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shacl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-kg:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyshacl==0.40.1' 'rdflib==7.6.0'

      - name: Select current RDF graph
        id: graph
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t metadata < <(
            python - <<'PY'
          import ast
          from pathlib import Path

          script = Path("scripts/03_build_kg_from_tables.py")
          tree = ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          values = {}
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if isinstance(target, ast.Name) and target.id in {"SCRIPT_VERSION", "KG_VERSION"}:
                      values[target.id] = ast.literal_eval(node.value)

          missing = {"SCRIPT_VERSION", "KG_VERSION"} - values.keys()
          if missing:
              raise SystemExit(f"Missing version assignment(s) in {script}: {sorted(missing)}")

          print(values["KG_VERSION"])
          print(values["SCRIPT_VERSION"])
          PY
          )

          kg_version=${metadata[0]}
          script_version=${metadata[1]}
          canonical="kg/makaao_kg_${kg_version}.rdf"
          sample="kg/makaao_kg_sample.rdf"

          if [[ -f "$canonical" ]]; then
            graph=$canonical
          elif [[ -f "$sample" ]]; then
            graph=$sample
          else
            printf 'Neither current canonical graph %s nor sample graph %s exists.\n' \
              "$canonical" "$sample" >&2
            exit 1
          fi

          echo "path=$graph" >> "$GITHUB_OUTPUT"
          echo "script_version=$script_version" >> "$GITHUB_OUTPUT"
          echo "kg_version=$kg_version" >> "$GITHUB_OUTPUT"
          echo "Validating $graph for script $script_version / KG $kg_version"

      - name: Parse files and reject a stale graph fixture
        env:
          DATA_GRAPH: ${{ steps.graph.outputs.path }}
          EXPECTED_SCRIPT_VERSION: ${{ steps.graph.outputs.script_version }}
        run: |
          python - <<'PY'
          import os
          from rdflib import Graph, Literal, Namespace

          graph_path = os.environ["DATA_GRAPH"]
          expected_version = os.environ["EXPECTED_SCRIPT_VERSION"]

          Graph().parse("tests/shacl_shapes.ttl", format="turtle")
          data = Graph().parse(graph_path, format="xml")
          dcterms = Namespace("http://purl.org/dc/terms/")
          recorded_versions = {str(value) for value in data.objects(None, dcterms.hasVersion)}
          if expected_version not in recorded_versions:
              raise SystemExit(
                  f"{graph_path} is stale: expected script version {expected_version!r}; "
                  f"recorded versions are {sorted(recorded_versions)!r}"
              )
          print(f"RDF parsing and fixture-version check passed ({len(data)} triples)")
          PY

      - name: Run SHACL validation
        id: shacl
        shell: bash
        env:
          DATA_GRAPH: ${{ steps.graph.outputs.path }}
        run: |
          set +e
          pyshacl \
            --shacl tests/shacl_shapes.ttl \
            --shacl-file-format turtle \
            --data-file-format xml \
            --inference rdfs \
            --advanced \
            --format human \
            --allow-warnings \
            --output shacl_report.txt \
            "$DATA_GRAPH"
          status=$?
          set -e
          if [[ -f shacl_report.txt ]]; then
            cat shacl_report.txt
          fi
          exit "$status"

      - name: Upload SHACL report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shacl-validation-report
          path: shacl_report.txt
          if-no-files-found: error
